# Local dev: Node app + Local Bot API server (separate containers).
# The bot container talks to telegram-bot-api over http://telegram-bot-api:8081.
# This is the recommended way to test >20 MB files locally.
# Copy .env.example to .env first and fill in real values — never commit .env.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      BASE_URL: ${BASE_URL:-http://localhost:10000}
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
      PORT: 10000
    ports:
      - "10000:10000"

volumes:
  telegram-bot-api-data:
